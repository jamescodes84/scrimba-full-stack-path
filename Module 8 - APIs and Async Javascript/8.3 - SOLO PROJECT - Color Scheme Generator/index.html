<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body id="body">
        <div id="outermost-container">
            <div id="toolbar">

                <div id="color-picker-container">
                    <input id="color-picker-input" type="color"/>
                </div>

                <div id="scheme-dropdown-container" >
                    <select name="schemas" id="schema-dropdown">
                        <option value="monochrome">Monochrome</option>
                        <option value="monochrome-dark">Monochrome-dark</option>
                        <option value="monochrome-light">Monochrome-light</option>
                        <option value="analogic">Analogic</option>
                        <option value="complement">Complement</option>
                        <option value="analogic-complement">Analogic-complement</option>
                        <option value="triad">Triad</option>
                    </select>
                </div>


                <div id="scheme-button-container">
                    <button id="schema-button" >Get color Schema</button>
                </div>

            </div>
            <div id="colors-outer-container">
                <div class="color-container" id="color-1"></div>
                <div class="color-container" id="color-2"></div>
                <div class="color-container" id="color-3"></div>
                <div class="color-container" id="color-4"></div>
                <div class="color-container" id="color-5"></div>
            </div>
            <div id="color-values-outer-container">
                <div class="color-value-container" id="color-1-value"></div>
                <div class="color-value-container" id="color-2-value"></div>
                <div class="color-value-container" id="color-3-value"></div>
                <div class="color-value-container" id="color-4-value"></div>
                <div class="color-value-container" id="color-5-value"></div>
            </div>

        </div>
    </body>
    <script src="index.js"></script>
</html>
