<!doctype html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="src/index.css">
        <meta charset="utf-8"/>
    </head>
    <body>

        <div id="outermost-container">
               <!-- Your HTML here -->

                <div id="header-outer-container">
                    Header
                    <div id="header-inner-container">
                        <img id="parrot-logo" src="src/assets/parrot.png" />
                        <div id="header-title-div">
                            <div id="header-title">PollyGlot</div>
                            <div id="header-subtitle">Perfect Translation Every Time</div>
                        </div>
                    </div>
                </div>
                
                <div id="translate-outer-container">
                    <div id="translate-inner-container">
                        <div id="translate-title-div" class="text-header">
                            Text to Translate 👇
                        </div>
                        <textarea id="text-to-translate" placeholder="How are you?"></textarea>

                        <form id="languages-form">
                            <fieldset id="languages-form-fieldset">
                                 <legend class="text-header">Select Language 👇</legend>
                                <div id="form-inner-div">
                                  
                                   
                                      <div class="form-input-div">
                                        <label for="french" class="radio-button">French <img src="src/assets/fr-flag.png" class="radio-button-img"/></label>
                                        <input id="french" type="radio" name="language" value="french" class="radio" checked/>
                                        </div>

                                    <div class="form-input-div">
                                        <label for="spanish" class="radio-button">Spanish <img src="src/assets/sp-flag.png" class="radio-button-img"/></label>
                                         <input id="spanish" type="radio" name="language" value="spanish" class="radio"/>
                                    </div>
                                    <div class="form-input-div">
                                        <label for="japanese" class="radio-button">Japanese<img src="src/assets/jpn-flag.png" class="radio-button-img"/></label>
                                        <input id="japanese" type="radio" name="language" value="japanese" class="radio"/>

                                    </div>
                                    
                                    <button id="translate-button">Translate</button>
                                </div>
                            </fieldset>
                        </form>




                    </div>
                    
                </div>

                


            <script src="src/index.js" type="module"></script>
        </div>
     
        
    </body>
</html>
