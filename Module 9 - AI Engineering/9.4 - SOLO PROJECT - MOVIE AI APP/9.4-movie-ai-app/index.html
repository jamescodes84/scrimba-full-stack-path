<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Carter+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="src/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Carter+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>
    <div id="outermost-container">
      <div id="header-container">
        <img id="header-logo" src="src/assets/popcorn.png" />
        <div id="header-text">
          PopChoice
        </div>
      </div>
      <div id="content-container">
        <form>
          <label for="favorite-movie">What's your favorite movie and why?</label>
          <textarea id="favorite-movie" placeholder="My favorite movie is Harry Potter and the Goblet of Fire. I love watching the scene where Voldemort returns!" ></textarea>

          <label for="new-or-old" class="label">Are you in the mood for something new or a classic?</label>
          <textarea id="new-or-old" placeholder="I want movies that were released after 2000s"></textarea>

          <label for="funny-or-serious" class="label">Do you want to watch something more funny or more serious?</label>
          <textarea id="funny-or-serious" placeholder="I want to watch something silly and quotable"></textarea>

          <button id="lets-go-button">Let's Go</button>
        </form>
      </div>
    </div>
    
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
